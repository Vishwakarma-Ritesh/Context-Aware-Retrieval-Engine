apiVersion: apps/v1
kind: Deployment
metadata:
  name: semantic-rag-engine
spec:
  replicas: 2
  selector:
    matchLabels:
      app: semantic-rag-engine
  template:
    metadata:
      labels:
        app: semantic-rag-engine
    spec:
      containers:
        - name: api
          image: semantic-rag-engine:latest
          command: ["python", "-m", "uvicorn", "app.main:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: semantic-rag-engine-config
          readinessProbe:
            httpGet:
              path: /docs
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
