[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-rag-engine"
version = "0.1.0"
description = "Production-minded semantic retrieval benchmark engine."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "OpenAI Codex" }]
dependencies = [
  "sentence-transformers>=2.6.0",
  "faiss-cpu>=1.8.0",
  "numpy>=1.26.0",
  "pydantic>=2.7.0",
  "boto3>=1.34.0",
  "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.111.0",
  "uvicorn>=0.30.0",
]
dev = [
  "pytest>=8.2.0",
  "pytest-cov>=5.0.0",
  "fastapi>=0.111.0",
  "uvicorn>=0.30.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q --disable-warnings --maxfail=1"

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
